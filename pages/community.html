<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community - CommUnity</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="main-nav" aria-label="Primary navigation">
            <div class="nav-brand">
                <img src="/assets/logo.svg" alt="CommUnity Logo" class="logo">
                <h1>CommUnity</h1>
            </div>
            <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>

        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <div class="page-header">
                <h1>Community</h1>
                <p>Connect with others and share your experiences</p>
            </div>

            <div class="community-container">
                <!-- Community Posts -->
                <section class="posts-section" aria-label="Community posts">
                    <div class="post-actions">
                        <button class="create-post-btn">Create Post</button>
                        <div class="post-filters">
                            <label for="post-category" class="sr-only">Post category</label>
                            <select id="post-category" aria-label="Filter by category">
                                <option value="">All Categories</option>
                                <option value="events">Events</option>
                                <option value="questions">Questions</option>
                                <option value="resources">Resources</option>
                                <option value="stories">Stories</option>
                            </select>
                            <label for="post-sort" class="sr-only">Sort posts</label>
                            <select id="post-sort" aria-label="Sort posts">
                                <option value="recent">Most Recent</option>
                                <option value="popular">Most Popular</option>
                            </select>
                        </div>
                    </div>
                    <div id="posts-list" class="posts-list" role="feed" aria-label="Community posts feed">
                        <!-- Posts will be populated here -->
                    </div>
                </section>

                <!-- Chat Section -->
                <section class="chat-section" aria-label="Community chat">
                    <div class="chat-header">
                        <h2>Community Chat</h2>
                        <div class="chat-actions">
                            <button class="language-select" aria-label="Change language">
                                <span class="current-lang">English</span>
                                <span class="icon" aria-hidden="true">🌐</span>
                            </button>
                        </div>
                    </div>
                    <div class="chat-container">
                        <div id="chat-messages" class="chat-messages" role="log" aria-label="Chat messages" aria-live="polite">
                            <!-- Chat messages will be populated here -->
                        </div>
                        <div class="chat-input">
                            <label for="message-input" class="sr-only">Type your message</label>
                            <input type="text" id="message-input" placeholder="Type your message..." aria-label="Type your message">
                            <button id="send-message">Send</button>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="/" class="nav-item" data-page="home">
                <span class="icon" aria-hidden="true">🏠</span>
                <span>Home</span>
            </a>
            <a href="/pages/resources.html" class="nav-item" data-page="resources">
                <span class="icon" aria-hidden="true">🔍</span>
                <span>Resources</span>
            </a>
            <a href="/pages/jobs.html" class="nav-item" data-page="jobs">
                <span class="icon" aria-hidden="true">💼</span>
                <span>Jobs</span>
            </a>
            <a href="/pages/community.html" class="nav-item active" data-page="community" aria-current="page">
                <span class="icon" aria-hidden="true">👥</span>
                <span>Community</span>
            </a>
            <a href="/pages/profile.html" class="nav-item" data-page="profile">
                <span class="icon" aria-hidden="true">👤</span>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="/js/utils.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/translate.js"></script>
    <script>
        // Load posts on community page
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof loadPosts === 'function') {
                loadPosts();
            }
        });
    </script>
</body>
</html>
